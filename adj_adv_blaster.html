<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adj &amp; Adv Blaster — Spelling &amp; Conversion Game</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;font-family:Arial,sans-serif;}
#app{width:100%;max-width:900px;background:#16213e;border-radius:20px;padding:36px;border:3px solid #0f3460;position:relative;overflow:hidden;font-size:1.2em;}
.px{font-family:'Press Start 2P',monospace;}
.screen{display:none;}
.screen.active{display:block;}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:14px;z-index:10;transition:opacity .18s;}

.bb{font-size:13px;padding:14px 24px;border-radius:12px;cursor:pointer;border:2px solid #e94560;background:#e94560;color:#fff;font-family:'Press Start 2P',monospace;transition:all .15s;}
.bb:hover{background:#c53030;border-color:#c53030;transform:scale(1.03);}
.bb:active{transform:scale(.97);}
.bb-out{background:transparent;color:#e94560;}
.bb-out:hover{background:#e94560;color:#fff;}
.bb-blue{border-color:#63b3ed;background:#63b3ed;color:#1a1a2e;}
.bb-blue:hover{background:#3182ce;border-color:#3182ce;color:#fff;}
.bb-green{border-color:#48bb78;background:#48bb78;color:#1a1a2e;}
.bb-green:hover{background:#2f855a;border-color:#2f855a;color:#fff;}
.bb-sm{font-size:11px;padding:9px 16px;}
.bb-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;}

#sstitle{font-size:24px;line-height:2;margin-bottom:20px;color:#f6e05e;text-align:center;}
#namerow{display:flex;gap:12px;align-items:center;margin-bottom:16px;}
#namerow label{font-size:12px;color:#a0aec0;white-space:nowrap;font-family:'Press Start 2P',monospace;}
#pname{flex:1;background:#0f3460;border:2px solid #e94560;color:#f0e68c;padding:14px 16px;border-radius:10px;font-size:18px;outline:none;}
#pname:focus{border-color:#f6e05e;}
#pname::placeholder{color:#4a5568;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px;}
.mode-card{background:#0f3460;border:2px solid;border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .15s;}
.mode-card:hover{transform:scale(1.04);}
.mode-card .mc-icon{font-size:32px;margin-bottom:10px;}
.mode-card .mc-title{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.7;}
.mode-card .mc-sub{font-size:13px;color:#a0aec0;margin-top:8px;}
.mc-spell{border-color:#e94560;color:#e94560;}
.mc-conv{border-color:#f6e05e;color:#f6e05e;}
.mc-cloze{border-color:#805ad5;color:#b794f4;}
.mc-errhunt{border-color:#ed8936;color:#ed8936;}
.mc-review{border-color:#b794f4;color:#b794f4;}
.mc-badge{font-size:11px;background:#b794f4;color:#1a1a2e;padding:3px 9px;border-radius:5px;margin-top:8px;display:inline-block;font-family:'Press Start 2P',monospace;}

#hud{display:flex;gap:12px;margin-bottom:14px;}
.hc{flex:1;background:#0f3460;border-radius:12px;padding:10px 10px;text-align:center;border:1px solid #e94560;}
.hl{font-size:11px;color:#a0aec0;margin-bottom:4px;font-family:'Press Start 2P',monospace;}
.hv{font-size:24px;font-weight:bold;color:#f0e68c;}

#trow{display:flex;align-items:center;gap:6px;margin-bottom:14px;}
.ts{flex:1;height:17px;border-radius:4px;background:#0f3460;border:1px solid #e94560;transition:background .25s;}
.ts.done{background:#48bb78;}
.ts.cur{background:#ed8936;}
#tlabel{font-size:11px;color:#fc8181;white-space:nowrap;padding-left:6px;font-family:'Press Start 2P',monospace;}

#revprog{display:none;text-align:center;margin-bottom:14px;font-size:13px;color:#b794f4;font-family:'Press Start 2P',monospace;}

#bsec{display:none;margin-bottom:14px;background:#0f3460;border-radius:12px;padding:13px;border:1px solid #e94560;}
#bname{font-size:12px;color:#fc8181;font-weight:bold;text-align:center;margin-bottom:8px;font-family:'Press Start 2P',monospace;}
#bhbar{height:14px;background:#1a1a2e;border-radius:7px;overflow:hidden;}
#bhf{height:100%;border-radius:7px;background:#e94560;transition:width .3s;}

#tibar{height:12px;background:#0f3460;border-radius:6px;overflow:hidden;margin-bottom:14px;}
#tifill{height:100%;border-radius:6px;transition:width .07s linear;}

#combo{font-size:13px;text-align:center;min-height:20px;margin-bottom:4px;color:#f6e05e;font-family:'Press Start 2P',monospace;}
#vsign{border:4px solid #BA7517;border-radius:14px;text-align:center;padding:26px 18px 18px;margin:8px 0;position:relative;background:#FAC775;}
#vsign.conv-mode{background:#dbeafe;border-color:#3182ce;}
#vsign.review-mode{background:#f3e8ff;border-color:#805ad5;}
#vsign::before{content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:6px;height:12px;background:#888;}
#vdisp{font-family:'Press Start 2P',monospace;color:#412402;line-height:1.4;}
#vsign.conv-mode #vdisp{color:#1e3a5f;}
#vsign.review-mode #vdisp{color:#44337a;}
#vsub{font-size:18px;color:#7a5b00;margin-top:8px;min-height:22px;}
#vsign.conv-mode #vsub{color:#2b6cb0;}
#vsign.review-mode #vsub{color:#553c9a;}
#qsentence{display:none;background:#0f3460;border:2px solid #e94560;border-radius:14px;padding:20px 22px;margin:8px 0;font-size:20px;line-height:1.9;color:#e6e6ea;}
#qsentence .blank{display:inline-block;min-width:90px;border-bottom:3px solid #f6e05e;color:#f6e05e;font-weight:bold;text-align:center;}
#qsentence u{color:#fc8181;text-decoration-color:#e94560;}
#choiceRow{display:none;gap:14px;margin-bottom:10px;}
.choice-btn{flex:1;padding:18px 10px;border-radius:12px;border:2px solid #63b3ed;background:#0f3460;color:#63b3ed;font-size:16px;font-weight:bold;cursor:pointer;text-align:center;transition:all .15s;font-family:Arial,sans-serif;}
.choice-btn:hover{background:#1e3a5f;transform:scale(1.03);}
#qtype{font-size:15px;text-align:center;color:#a0aec0;margin-bottom:10px;}
#ainput{display:block;width:100%;font-size:26px;text-align:center;padding:16px;border-radius:12px;border:2px solid #e94560;background:#0f3460;color:#f0e68c;outline:none;}
#ainput:focus{border-color:#f6e05e;}
#ainput::placeholder{color:#4a5568;font-size:16px;}
#fb{font-size:16px;text-align:center;min-height:24px;margin:9px 0;font-weight:bold;}
.stars{font-size:34px;letter-spacing:8px;text-align:center;margin:10px 0;color:#2d3748;}
.stars .on{color:#f6e05e;}

#cd{text-align:center;padding:40px 0;}
#cdtxt{font-family:'Press Start 2P',monospace;font-size:72px;display:inline-block;}

#gotitle{font-size:18px;line-height:1.8;margin-bottom:14px;color:#f6e05e;text-align:center;}
#fscore{font-size:15px;color:#a0aec0;margin-bottom:10px;line-height:2.2;text-align:center;}
#fscore strong{color:#f0e68c;}
#frank{font-size:13px;color:#68d391;text-align:center;margin-bottom:12px;font-family:'Press Start 2P',monospace;min-height:18px;}
#rev{text-align:left;margin-top:12px;}
#rev h4{font-size:12px;font-weight:bold;color:#f6e05e;margin-bottom:10px;text-align:center;font-family:'Press Start 2P',monospace;}
.rc{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e94560;border-radius:10px;margin-bottom:8px;background:#0f3460;flex-wrap:wrap;}
.rv{font-family:'Press Start 2P',monospace;font-size:12px;color:#f0e68c;min-width:80px;}
.rt{font-size:11px;color:#fc8181;background:#1a1a2e;padding:3px 8px;border-radius:5px;}
.rw{font-size:14px;color:#fc8181;text-decoration:line-through;}
.rr{font-size:14px;color:#48bb78;font-weight:bold;}
.rar{color:#4a5568;font-size:13px;}

#lbtitle{font-size:16px;line-height:1.8;margin-bottom:16px;color:#f6e05e;text-align:center;}
#lbtable{width:100%;border-collapse:collapse;font-size:14px;}
#lbtable th{font-family:'Press Start 2P',monospace;font-size:10px;color:#a0aec0;padding:9px 6px;border-bottom:1px solid #0f3460;text-align:left;}
#lbtable td{padding:10px 6px;border-bottom:1px solid #0f3460;color:#f0e68c;vertical-align:middle;}
#lbtable tr.rank1 td{color:#f6e05e;}
#lbtable tr.rank2 td{color:#a0aec0;}
#lbtable tr.rank3 td{color:#ed8936;}
#lbtable tr.me td{background:rgba(99,179,237,.12);color:#63b3ed;}
.medal{font-size:13px;}

#mtoggle{position:absolute;top:14px;right:14px;background:#0f3460;border:1px solid #e94560;color:#f0e68c;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'Press Start 2P',monospace;z-index:20;}
#mtoggle:hover{background:#e94560;}
#backBtn{position:absolute;top:14px;left:14px;background:#0f3460;border:1px solid #63b3ed;color:#63b3ed;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'Press Start 2P',monospace;z-index:20;display:none;}
#backBtn:hover{background:#3182ce;color:#fff;}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes cdpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app">
<div id="flash"></div>
<button id="mtoggle" onclick="toggleMusic()">&#9834; ON</button>
<button id="backBtn" onclick="backToStart()">&larr; BACK</button>

<!-- START -->
<div id="ss" class="screen active">
  <p class="px" id="sstitle">ADJ &amp; ADV<br>BLASTER</p>
  <div id="namerow">
    <label for="pname">PLAYER:</label>
    <input id="pname" type="text" placeholder="enter your name" maxlength="16" autocomplete="off"/>
  </div>
  <div class="mode-grid">
    <div class="mode-card mc-spell" onclick="tryStart('spell')">
      <div class="mc-icon">&#128640;</div>
      <div class="mc-title">串字<br>任務</div>
      <div class="mc-sub">20 題 + BOSS</div>
    </div>
    <div class="mode-card mc-conv" onclick="tryStart('conv')">
      <div class="mc-icon">&#128260;</div>
      <div class="mc-title">轉換<br>特訓</div>
      <div class="mc-sub">Adj → Adv</div>
    </div>
    <div class="mode-card mc-cloze" onclick="tryStart('cloze')">
      <div class="mc-icon">&#128214;</div>
      <div class="mc-title">故事<br>填空</div>
      <div class="mc-sub">情境 + 串字</div>
    </div>
    <div class="mode-card mc-errhunt" onclick="tryStart('errhunt')">
      <div class="mc-icon">&#128269;</div>
      <div class="mc-title">抓錯<br>任務</div>
      <div class="mc-sub">判斷 + 改錯字</div>
    </div>
    <div class="mode-card mc-review" onclick="tryStart('review')" id="reviewCard">
      <div class="mc-icon">&#128257;</div>
      <div class="mc-title">錯題<br>回顧</div>
      <div id="reviewBadge" class="mc-badge" style="display:none;"></div>
      <div class="mc-sub" id="reviewSub">No wrong answers yet</div>
    </div>
  </div>
  <div class="bb-row">
    <button class="bb bb-blue bb-sm" onclick="showScreen('lb')">LEADERBOARD</button>
  </div>
</div>

<!-- COUNTDOWN -->
<div id="cd" class="screen"><div id="cdtxt"></div></div>

<!-- GAME -->
<div id="gscreen" class="screen">
  <div id="hud">
    <div class="hc"><div class="hl" id="hl0">SCORE</div><div class="hv" id="sv">0</div></div>
    <div class="hc"><div class="hl" id="hl1">Q</div><div class="hv" id="lv">0/20</div></div>
    <div class="hc"><div class="hl" id="hl2">MISS</div><div class="hv" id="lf">0</div></div>
  </div>
  <div id="trow">
    <div class="ts" id="ts0"></div><div class="ts" id="ts1"></div>
    <div class="ts" id="ts2"></div><div class="ts" id="ts3"></div>
    <div class="ts" id="ts4"></div>
    <div id="tlabel">&rarr; BOSS!</div>
  </div>
  <div id="revprog"></div>
  <div id="bsec">
    <div id="bname"></div>
    <div id="bhbar"><div id="bhf" style="width:100%"></div></div>
  </div>
  <div id="tibar"><div id="tifill" style="width:100%;background:#48bb78;"></div></div>
  <div id="combo"></div>
  <div id="vsign">
    <div id="vdisp"></div>
    <div id="vsub"></div>
  </div>
  <div id="qsentence"></div>
  <div id="qtype"></div>
  <input id="ainput" type="text" placeholder="type here then press Enter" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/>
  <div id="choiceRow">
    <button class="choice-btn" onclick="chooseAnswer('Adjective')">Adjective<br>形容詞</button>
    <button class="choice-btn" onclick="chooseAnswer('Adverb')">Adverb<br>副詞</button>
  </div>
  <div id="fb"></div>
</div>

<!-- GAME OVER / VICTORY -->
<div id="gs" class="screen">
  <p class="px" id="gotitle">GAME<br>OVER</p>
  <div id="fscore"></div>
  <div id="frank"></div>
  <div id="rev"></div>
  <div class="bb-row">
    <button class="bb bb-sm" id="playAgainBtn" onclick="tryStart('spell')">PLAY AGAIN</button>
    <button class="bb bb-blue bb-sm" onclick="nextPlayer()">NEXT PLAYER</button>
    <button class="bb bb-green bb-sm" onclick="showScreen('lb')">LEADERBOARD</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="lb" class="screen">
  <p class="px" id="lbtitle">LEADERBOARD</p>
  <table id="lbtable">
    <thead><tr><th>#</th><th>NAME</th><th>SCORE</th><th>MODE</th><th>DATE</th></tr></thead>
    <tbody id="lbbody"></tbody>
  </table>
  <div id="lbempty" style="display:none;text-align:center;color:#4a5568;font-size:12px;padding:20px;">No scores yet!</div>
  <div class="bb-row">
    <button class="bb bb-out bb-sm" onclick="showScreen('ss')">BACK</button>
    <button class="bb bb-out bb-sm" onclick="clearLB()" style="border-color:#4a5568;color:#4a5568;">CLEAR ALL</button>
  </div>
</div>

</div>

function getLB(){return JSON.parse(localStorage.getItem('aab_lb')||'[]');}
function saveLB(a){localStorage.setItem('aab_lb',JSON.stringify(a));}
function getPersistentWrongs(){return JSON.parse(localStorage.getItem('aab_review')||'[]');}
function dedupKey(cv){return cv.kind+'|'+(cv.correct||'')+'|'+(cv.sentence?cv.sentence.replace(/<[^>]+>/g,''):cv.prompt||'');}
function addPersistentWrong(cv){
  let list=getPersistentWrongs();
  let key=dedupKey(cv);
  let idx=list.findIndex(r=>r.dedupKey===key);
  if(idx>=0){list[idx].count=Math.min(list[idx].count+1,5);}
  else{list.push({dedupKey:key,kind:cv.kind,prompt:cv.prompt||'',sentence:cv.sentence||'',correct:cv.correct,zh:cv.zh||'',count:2});}
  localStorage.setItem('aab_review',JSON.stringify(list));
}
function reducePersistentWrong(cv){
  let list=getPersistentWrongs();
  let key=dedupKey(cv);
  let idx=list.findIndex(r=>r.dedupKey===key);
  if(idx>=0){list[idx].count--;if(list[idx].count<=0)list.splice(idx,1);}
  localStorage.setItem('aab_review',JSON.stringify(list));
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildSpellPool(){
  let pool=[...ADJ.map(w=>({kind:'adj',prompt:w.zh,correct:w.en,label:'形容詞 Adjective — 串出英文'})),
            ...ADV.map(w=>({kind:'adv',prompt:w.zh,correct:w.en,label:'副詞 Adverb — 串出英文'}))];
  return shuffle(pool).slice(0,20);
}
function buildConvPool(){
  return shuffle(CONV).slice(0,20).map(p=>({kind:'conv',prompt:p.adj,correct:p.adv,label:'轉做副詞 → adverb form'}));
}
function buildBossPool(mode){
  if(mode==='spell')return shuffle(CONV).slice(0,8).map(p=>({kind:'conv',prompt:p.adj,correct:p.adv,label:'BOSS：轉做副詞 → adverb form'}));
  return shuffle(CONV).slice(0,8).map(p=>({kind:'conv-r',prompt:p.adv,correct:p.adj,label:'BOSS：轉返做形容詞 → adjective form'}));
}
function buildClozePool(){
  let pool=[...ADJ.map(w=>({...w,type:'adj'})),...ADV.map(w=>({...w,type:'adv'}))];
  return shuffle(pool).slice(0,20).map(w=>{
    let tpl=w.type==='adj'?ADJ_TPL[Math.floor(Math.random()*ADJ_TPL.length)]:ADV_TPL[Math.floor(Math.random()*ADV_TPL.length)];
    return {kind:'cloze',prompt:w.en,sentence:tpl.replace('___','<span class="blank">?</span>'),correct:w.en,zh:w.zh,label:'睇上下文，填啱形態嘅串法（'+w.zh+'）'};
  });
}
function buildJudgePool(n){
  let pool=[...ADJ.map(w=>({...w,type:'Adjective'})),...ADV.map(w=>({...w,type:'Adverb'}))];
  return shuffle(pool).slice(0,n).map(w=>{
    let tpl=w.type==='Adjective'?ADJ_TPL[Math.floor(Math.random()*ADJ_TPL.length)]:ADV_TPL[Math.floor(Math.random()*ADV_TPL.length)];
    return {kind:'judge',prompt:w.en,sentence:tpl.replace('___','<u>'+w.en+'</u>'),correct:w.type,zh:w.zh,label:'呢個字係咩詞性？'};
  });
}
function buildFixPool(n){
  return shuffle(CONV).slice(0,n).map(pair=>{
    let wrongIsAdjInAdvSlot=Math.random()<0.5;
    if(wrongIsAdjInAdvSlot){
      let tpl=ADV_TPL[Math.floor(Math.random()*ADV_TPL.length)];
      return {kind:'fix',prompt:pair.adj+'/'+pair.adv,sentence:tpl.replace('___','<u>'+pair.adj+'</u>'),correct:pair.adv,zh:'',label:'呢句用錯咗，打出啱嘅字'};
    }
    let tpl=ADJ_TPL[Math.floor(Math.random()*ADJ_TPL.length)];
    return {kind:'fix',prompt:pair.adj+'/'+pair.adv,sentence:tpl.replace('___','<u>'+pair.adv+'</u>'),correct:pair.adj,zh:'',label:'呢句用錯咗，打出啱嘅字'};
  });
}
function buildErrhuntPool(){
  return shuffle([...buildJudgePool(10),...buildFixPool(10)]);
}
function starsFor(correct,total){let r=total?correct/total:0;if(r>=0.9)return 3;if(r>=0.7)return 2;if(r>=0.5)return 1;return 0;}

function nt(freq,t,dur,vol=0.08,type='square'){
  if(!AC||!freq)return;
  let o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur*.82);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
}
function sched(){
  if(!musicOn||!AC)return;
  let tk=mTrk==='b'?TB:TN;
  while(mSched<AC.currentTime+.5){let n=tk[mPos%tk.length];nt(n[0],mSched,n[1]*B);mSched+=n[1]*B;mPos++;}
  mTimer=setTimeout(sched,90);
}

  if(mode==='review'){
    let list=getPersistentWrongs();
    if(!list.length){alert('No wrong answers saved yet!\nPlay 串字任務 or 轉換特訓 first.');return;}
  }
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}
  countdown(mode);
}

function nextPlayer(){document.getElementById('pname').value='';currentPlayer='';showScreen('ss');}

// ── COUNTDOWN ─────────────────────────────────────────────────────────────
function countdown(mode){
  showScreen('cd');
  let tx=document.getElementById('cdtxt');
  let steps=[['3','#fc8181'],['2','#f6e05e'],['1','#68d391'],['GO!','#63b3ed']];
  let i=0;
  function tick(){
    tx.style.animation='none';tx.offsetHeight;
    tx.style.animation='cdpop .55s forwards';
    tx.textContent=steps[i][0];tx.style.color=steps[i][1];
    i<3?sfxTick():sfxGo();i++;
    if(i<steps.length)setTimeout(tick,680);
    else setTimeout(()=>startGame(mode),700);
  }
  tick();
}

// ── GAME ENGINE ────────────────────────────────────────────────────────────
let S={};
const $=id=>document.getElementById(id);

function startGame(mode){
  S={score:0,misses:0,combo:0,correct:0,phase:'n',mode:mode,
    qIndex:0,totalQ:20,
    pool:mode==='conv'?buildConvPool():mode==='spell'?buildSpellPool():mode==='cloze'?buildClozePool():mode==='errhunt'?buildErrhuntPool():[],
    bHp:0,bMax:0,bPool:[],cv:null,tid:null,ans:false,wrong:[],
    reviewPool:mode==='review'?[...getPersistentWrongs()].sort(()=>Math.random()-.5):[],
    masteredCount:0
  };

  $('hl0').textContent=mode==='review'?'REMAINING':'SCORE';
  $('hl1').textContent=mode==='review'?'MASTERED':'Q';
  $('hl2').textContent=mode==='review'?'-':'MISS';
  $('trow').style.display=mode==='review'?'none':'flex';
  $('revprog').style.display=mode==='review'?'block':'none';

  $('vsign').className=(mode==='conv'||mode==='cloze'||mode==='errhunt')?'conv-mode':mode==='review'?'review-mode':'';
  $('playAgainBtn').onclick=()=>tryStart(mode);

  showScreen('gscreen');
  $('ainput').onkeydown=e=>{if(e.key==='Enter'&&S.ans)submit();};
  updStats();updTrack();
  startMusic('n');
  nextQ();
}

function tLimit(){
  if(S.mode==='review')return 15000;
  if(S.phase==='b')return 6500;
  return Math.max(3500,9000-S.qIndex*250);
}

function renderQuestion(){
  $('bsec').style.display=S.phase==='b'?'block':'none';
  let kind=S.cv.kind;
  let isSentence=(kind==='cloze'||kind==='fix'||kind==='judge');
  let noTimer=(S.mode==='cloze'||S.mode==='errhunt');

  $('vsign').style.display=isSentence?'none':'block';
  $('qsentence').style.display=isSentence?'block':'none';
  if(isSentence)$('qsentence').innerHTML=S.cv.sentence;
  else setWord(S.cv.prompt,S.cv.zh||'');

  $('choiceRow').style.display=kind==='judge'?'flex':'none';
  $('ainput').style.display=kind==='judge'?'none':'block';
  $('tibar').style.display=noTimer?'none':'block';

  $('qtype').textContent=S.cv.label;
  $('combo').textContent=S.combo>=2?'COMBO x'+S.combo+'!':'';
  $('ainput').value='';
  if(kind!=='judge')$('ainput').focus();
  S.ans=true;
  if(noTimer){$('tifill').style.width='100%';} else {startTimer();}
}

function nextQ(){
  clearTimer();$('fb').textContent='';$('fb').style.color='';$('vsub').textContent='';S.ans=false;
  if(!S)return;

  if(S.mode==='review'){nextReviewQ();return;}

  if(S.phase==='b'){
    if(S.bHp<=0){bossEnd();return;}
    if(!S.bPool.length)S.bPool=buildBossPool(S.mode);
    S.cv=S.bPool.shift();
    updBoss();
    renderQuestion();
    return;
  }

  if(!S.pool.length){
    if(S.mode==='spell'||S.mode==='conv'){enterBossPhase();return;}
    endRun();return;
  }
  S.cv=S.pool.shift();
  renderQuestion();
}

function enterBossPhase(){
  S.phase='b';
  let def=S.mode==='conv'?CONV_BOSS:SPELL_BOSS;
  S.bHp=def.hp;S.bMax=def.hp;S.bPool=buildBossPool(S.mode);
  swMusic('b');sfxBoss();
  $('bsec').style.display='block';$('bname').textContent='BOSS: '+def.name;updBoss();
  $('fb').textContent='BOSS INCOMING! Defeat '+def.name+'!';$('fb').style.color='#fc8181';
  $('ainput').value='';S.ans=false;
  setTimeout(()=>{$('fb').textContent='';$('fb').style.color='';nextQ();},1600);
}

function bossEnd(){
  swMusic('n');
  $('bsec').style.display='none';
  endRun();
}

function nextReviewQ(){
  if(!S.reviewPool.length){
    let fresh=getPersistentWrongs();
    if(!fresh.length){reviewComplete();return;}
    S.reviewPool=[...fresh].sort(()=>Math.random()-.5);
  }
  let item=S.reviewPool.shift();
  let kindLabel={adj:'形容詞 Adjective — 串出英文',adv:'副詞 Adverb — 串出英文','conv':'轉做副詞 → adverb form','conv-r':'轉返做形容詞 → adjective form',cloze:'故事填空 — 填啱串法',judge:'呢個字係咩詞性？',fix:'呢句用錯咗，打出啱嘅字'}[item.kind]||item.kind;
  S.cv={kind:item.kind,prompt:item.prompt,sentence:item.sentence,correct:item.correct,zh:item.zh||'',label:kindLabel};
  let remaining=getPersistentWrongs().length;
  $('revprog').textContent='REMAINING: '+remaining+' / MASTERED: '+S.masteredCount;
  renderQuestion();
}

function reviewComplete(){
  clearTimer();stopMusic();sfxMastered();
  showScreen('gs');
  $('gotitle').textContent='ALL DONE!';
  $('fscore').innerHTML='<span style="color:#b794f4;font-family:\'Press Start 2P\',monospace;font-size:11px;">錯題全部掌握!</span><br>Mastered: <strong>'+S.masteredCount+'</strong> words';
  $('frank').textContent='';
  $('rev').innerHTML='<p style="text-align:center;font-size:11px;color:#68d391;margin:14px 0;font-family:\'Press Start 2P\',monospace;">PERFECT REVIEW!</p>';
  $('ainput').onkeydown=null;
}

function setWord(w,sub){
  let n=w.length,sz=n<=2?52:n<=3?48:n<=5?38:n<=7?30:n<=9?24:n<=12?20:16;
  if(/[一-鿿]/.test(w)){sz=w.length<=3?36:w.length<=5?28:22;}
  $('vdisp').style.fontSize=sz+'px';
  $('vdisp').textContent=w;
  $('vsub').textContent=sub||'';
}

function updBoss(){
  let p=S.bHp/S.bMax*100;
  $('bhf').style.width=p+'%';
  $('bhf').style.background=p>55?'#e94560':p>30?'#ed8936':'#48bb78';
}
function updTrack(){
  if(S.mode==='review')return;
  let segDone=Math.floor(S.qIndex/4);
  for(let i=0;i<5;i++){
    let el=$('ts'+i);el.className='ts';
    if(segDone>i)el.classList.add('done');
    else if(segDone===i&&S.phase==='n')el.classList.add('cur');
  }
}

function startTimer(){
  let lim=tLimit(),t0=Date.now();
  S.tid=setInterval(()=>{
    let r=Math.max(0,1-(Date.now()-t0)/lim);
    $('tifill').style.width=(r*100)+'%';
    $('tifill').style.background=r>.55?'#48bb78':r>.25?'#ed8936':'#e94560';
    if(r<=0){clearTimer();if(S.ans){S.ans=false;timeout();}}
  },60);
}
function clearTimer(){if(S.tid){clearInterval(S.tid);S.tid=null;}}

function doFlash(col){
  let fl=$('flash');fl.style.background=col;fl.style.opacity='.25';
  setTimeout(()=>fl.style.opacity='0',200);
}

function timeout(){
  let ans=S.cv.correct;
  sfxWrong();doFlash('#e94560');
  if(S.mode!=='review')addPersistentWrong(S.cv);
  S.wrong.push({base:S.cv.prompt||(S.cv.sentence?S.cv.sentence.replace(/<[^>]+>/g,''):''),kind:S.cv.kind,user:'(time out)',correct:ans,zh:S.cv.zh});
  $('fb').textContent="Time's up! → "+ans;$('fb').style.color='#fc8181';
  S.combo=0;
  if(S.mode!=='review'){S.misses++;}
  if(S.phase==='n'&&S.mode!=='review'){S.qIndex++;updTrack();}
  updStats();
  setTimeout(()=>nextQ(),1300);
}

function submit(){
  let inp=$('ainput').value.trim().toLowerCase();if(!inp)return;
  S.ans=false;
  let correct=S.cv.correct.trim().toLowerCase();
  let ok=correct.split('/').map(x=>x.trim());
  if(ok.includes(inp))onRight();else onWrong(inp,S.cv.correct);
}

function chooseAnswer(ans){
  if(!S.ans)return;
  S.ans=false;
  if(ans===S.cv.correct)onRight();else onWrong(ans,S.cv.correct);
}

function onRight(){
  clearTimer();S.combo++;S.correct++;
  let pts=Math.min(S.combo,6);S.score+=pts;sfxCoin();

  if(S.mode==='review'){
    reducePersistentWrong(S.cv);
    S.masteredCount++;
    $('fb').textContent=S.combo>=3?'MASTERED! Combo x'+S.combo+'!':'Correct! Keep going!';
    $('fb').style.color='#b794f4';
    updStats();setTimeout(()=>nextQ(),650);return;
  }

  if(S.phase==='b'){
    S.bHp--;
    $('fb').textContent=S.combo>=3?'HIT! Combo x'+S.combo+'! ('+S.bHp+' HP)':'Direct hit! ('+S.bHp+' HP)';
    $('fb').style.color='#68d391';
    updStats();updBoss();
    if(S.bHp<=0){setTimeout(()=>bossEnd(),650);return;}
  } else {
    S.qIndex++;
    $('fb').textContent=S.combo>=3?'CORRECT! Combo x'+S.combo+'! +'+pts:'Correct! +'+pts;
    $('fb').style.color='#68d391';
    updStats();updTrack();
  }
  $('vsign').style.animation='none';$('vsign').offsetHeight;$('vsign').style.animation='pop .25s';
  setTimeout(()=>nextQ(),640);
}

function onWrong(user,correct){
  clearTimer();S.combo=0;sfxWrong();doFlash('#e94560');
  addPersistentWrong(S.cv);
  S.wrong.push({base:S.cv.prompt||(S.cv.sentence?S.cv.sentence.replace(/<[^>]+>/g,''):''),kind:S.cv.kind,user,correct,zh:S.cv.zh});
  $('fb').textContent='Wrong! → '+correct;$('fb').style.color='#fc8181';
  if(S.cv.kind!=='judge'){let ai=$('ainput');ai.style.animation='none';ai.offsetHeight;ai.style.animation='shake .4s';}
  if(S.mode!=='review'){S.misses++;}
  if(S.mode!=='review'&&S.phase==='n'){S.qIndex++;updTrack();}
  updStats();
  setTimeout(()=>nextQ(),1300);
}

function updStats(){
  if(S.mode==='review'){
    let rem=getPersistentWrongs().length;
    $('sv').textContent=rem;
    $('lv').textContent=S.masteredCount;
    $('lf').textContent='-';
  } else {
    $('sv').textContent=S.score;
    $('lv').textContent=Math.min(S.qIndex,20)+'/20';
    $('lf').textContent=S.misses;
  }
}

function endRun(){
  clearTimer();stopMusic();sfxClear();
  $('ainput').onkeydown=null;

  let lb=getLB();
  let modeLabel={spell:'串字任務',conv:'轉換特訓',cloze:'故事填空',errhunt:'抓錯任務'}[S.mode]||S.mode;
  let entry={name:currentPlayer,score:S.score,mode:modeLabel,date:new Date().toLocaleDateString('zh-HK')};
  lb.push(entry);lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,30);saveLB(lb);
  let rank=lb.findIndex(e=>e.name===entry.name&&e.score===entry.score&&e.date===entry.date)+1;
  pushCloudScore(entry);

  let hasBoss=(S.mode==='spell'||S.mode==='conv');
  $('gotitle').textContent=hasBoss?'VICTORY!':'COMPLETE!';

  let st=starsFor(S.correct,S.totalQ);
  let starsHtml=hasBoss?'':'<div class="stars">'+[1,2,3].map(i=>'<span class="'+(i<=st?'on':'')+'">★</span>').join('')+'</div>';
  let msg=hasBoss?(S.score<20?'BOSS DEFEATED!':S.score<40?'GREAT VICTORY!':'GRAND CHAMPION!'):(st>=3?'PERFECT!':st>=2?'WELL DONE!':'KEEP PRACTISING!');

  $('fscore').innerHTML=currentPlayer+' — Score: <strong>'+S.score+'</strong> · Correct: <strong>'+S.correct+'</strong>'+(hasBoss?'':'/'+S.totalQ)+starsHtml+'<span style="color:#f0e68c;font-family:\'Press Start 2P\',monospace;font-size:10px;">'+msg+'</span>';
  $('frank').textContent=rank?'YOUR RANK: #'+rank+' ('+lb.length+' players)':'';

  let rv=$('rev');
  if(!S.wrong.length){
    rv.innerHTML='<p style="text-align:center;font-size:10px;color:#68d391;margin:12px 0;font-family:\'Press Start 2P\',monospace;">PERFECT RUN!</p>';
  } else {
    let kindNames={adj:'形容詞',adv:'副詞','conv':'轉換','conv-r':'轉換',cloze:'填空',judge:'詞性',fix:'改錯'};
    let h='<h4>WRONG ANSWERS ('+S.wrong.length+') — saved for 錯題回顧</h4>';
    S.wrong.forEach(w=>{
      let lbl=kindNames[w.kind]||w.kind;
      let hint=w.zh&&w.zh!==w.base?' ('+w.zh+')':'';
      h+=`<div class="rc"><span class="rv">${w.base}${hint}</span><span class="rt">${lbl}</span><span class="rar">→</span><span class="rw">${w.user}</span><span class="rar">→</span><span class="rr">${w.correct}</span></div>`;
    });
    rv.innerHTML=h;
  }
  showScreen('gs');
}

// ── LEADERBOARD ────────────────────────────────────────────────────────────
async function renderLB(){
  let tbody=$('lbbody');let empty=$('lbempty');
  let cloud=await fetchCloudLB();
  let lb;
  if(cloud){
    lb=cloud.map(r=>({name:r.player_name,score:r.score,mode:r.mode||'',date:new Date(r.created_at).toLocaleDateString('zh-HK')}));
  } else {
    lb=getLB(); // offline fallback — this device's own history only
  }
  if(!lb.length){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  let medals=['🥇','🥈','🥉'];
  tbody.innerHTML=lb.map((e,i)=>{
    let cls=i===0?'rank1':i===1?'rank2':i===2?'rank3':e.name===currentPlayer?'me':'';
    let medal=i<3?'<span class="medal">'+medals[i]+'</span>':'#'+(i+1);
    return`<tr class="${cls}"><td>${medal}</td><td>${e.name}</td><td>${e.score}</td><td style="font-size:11px;">${e.mode}</td><td style="font-size:11px;">${e.date}</td></tr>`;
  }).join('');
}
function clearLB(){if(confirm('Clear all LOCAL scores? (cloud scores must be removed from the Supabase dashboard)')){saveLB([]);renderLB();}}
subscribeCloudLB(function(){ if(document.getElementById('lb').classList.contains('active')) renderLB(); });

// ── INIT ──────────────────────────────────────────────────────────────────
document.getElementById('pname').addEventListener('keydown',e=>{if(e.key==='Enter')tryStart(currentMode||'spell');});
updateReviewBadge();
</script>
